spring.application.name=mcp-app
server.port=8000

# Groq API configuration
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.tool-choice=auto

# Logging
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# MCP configuration
spring.ai.mcp.client.studio.servers-configuration=classpath:servers.json
logging.level.org.springframework.ai.mcp=DEBUG